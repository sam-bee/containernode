apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: element-web
  template:
    metadata:
      labels:
        app: element-web
    spec:
      containers:
        - name: element-web
          image: vectorim/element-web:v1.12.23
          env:
            - name: ELEMENT_WEB_PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 256Mi
          ports:
            - name: http
              containerPort: 8080
              hostIP: 127.0.0.1
              hostPort: 8081
          readinessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: element-web-nginx
