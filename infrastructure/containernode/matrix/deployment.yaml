apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      labels:
        app: synapse
    spec:
      securityContext:
        fsGroup: 991
      initContainers:
        - name: prepare-data-dir
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - mkdir -p /data/media_store && chown -R 991:991 /data
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: synapse
          image: ghcr.io/element-hq/synapse:v1.142.0
          command:
            - /bin/sh
            - -ec
            - |
              cat > /run/synapse/homeserver.yaml <<EOF
              server_name: "matrix"
              public_baseurl: "https://matrix/"
              pid_file: /data/homeserver.pid

              listeners:
                - port: 8008
                  type: http
                  tls: false
                  x_forwarded: true
                  bind_addresses: ["0.0.0.0"]
                  resources:
                    - names: [client]
                      compress: false

              database:
                name: psycopg2
                args:
                  user: "$POSTGRES_USER"
                  password: "$POSTGRES_PASSWORD"
                  dbname: "$POSTGRES_DB"
                  host: "$POSTGRES_HOST"
                  port: $POSTGRES_PORT
                  cp_min: 5
                  cp_max: 10
                  keepalives_idle: 10
                  keepalives_interval: 10
                  keepalives_count: 3

              log_config: /run/synapse/log.config
              media_store_path: /data/media_store
              signing_key_path: /data/matrix.signing.key
              registration_shared_secret_path: /run/synapse-secrets/REGISTRATION_SHARED_SECRET
              macaroon_secret_key_path: /run/synapse-secrets/MACAROON_SECRET_KEY
              form_secret_path: /run/synapse-secrets/FORM_SECRET

              enable_registration: false
              allow_public_rooms_without_auth: false
              allow_public_rooms_over_federation: false
              enable_3pid_lookup: false
              report_stats: false
              trusted_key_servers: []
              suppress_key_server_warning: true

              presence:
                enabled: true
              EOF

              cat > /run/synapse/log.config <<'EOF'
              version: 1

              formatters:
                precise:
                  format: "%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s"

              handlers:
                console:
                  class: logging.StreamHandler
                  formatter: precise

              loggers:
                synapse.storage.SQL:
                  level: INFO

              root:
                level: INFO
                handlers: [console]

              disable_existing_loggers: false
              EOF

              exec /start.py
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 2Gi
              ephemeral-storage: 1Gi
          env:
            - name: SYNAPSE_CONFIG_PATH
              value: /run/synapse/homeserver.yaml
            - name: UID
              value: "991"
            - name: GID
              value: "991"
            - name: TZ
              value: Europe/London
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: synapse-db
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: synapse-db
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: synapse-db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: synapse-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synapse-db
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 8008
              hostIP: 127.0.0.1
              hostPort: 8008
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime-config
              mountPath: /run/synapse
            - name: synapse-secrets
              mountPath: /run/synapse-secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matrix-synapse-data
        - name: runtime-config
          emptyDir: {}
        - name: synapse-secrets
          secret:
            secretName: synapse-secrets
            defaultMode: 0440
