apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-mcp
  namespace: email-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: email-mcp
  template:
    metadata:
      labels:
        app: email-mcp
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: email-mcp-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: email-mcp
          image: ghcr.io/sam-bee/email-mcp:latest@sha256:07ce4ce3376a8f1a05daa767ec9474a61c7260eabc2f84600bb7641a6d23204f # {"$imagepolicy": "flux-system:email-mcp"}
          env:
            - name: JMAP_SESSION_URL
              value: http://stalwart-jmap.stalwart.svc.cluster.local:8080/.well-known/jmap
            - name: JMAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: email-mcp-jmap
                  key: token
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
