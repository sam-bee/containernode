apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-mcp
  namespace: email-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: email-mcp
  template:
    metadata:
      labels:
        app: email-mcp
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: email-mcp-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: email-mcp
          image: ghcr.io/sam-bee/email-mcp:latest@sha256:a65539e7fd22f704a77e0b9c9d9a8de5183cf5304bc15068c2ed3c1fa947f04a # {"$imagepolicy": "flux-system:email-mcp"}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
