apiVersion: v1
kind: Service
metadata:
  name: stalwart-smtp
  namespace: stalwart
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: false
  selector:
    app: stalwart
  ports:
    - {name: smtp, port: 25, targetPort: smtp}
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-jmap
  namespace: stalwart
spec:
  selector:
    app: stalwart
  ports:
    - {name: jmap, port: 8080, targetPort: jmap}
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-acme
  namespace: stalwart
spec:
  selector:
    app: stalwart
  ports:
    - {name: acme, port: 8081, targetPort: acme}
