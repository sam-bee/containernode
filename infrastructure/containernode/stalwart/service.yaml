apiVersion: v1
kind: Service
metadata:
  name: stalwart-smtp
  namespace: stalwart
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: false
  selector:
    app: stalwart
  ports:
    - {name: smtp, port: 25, targetPort: smtp}
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-jmap
  namespace: stalwart
spec:
  selector:
    app: stalwart
  ports:
    - {name: jmap, port: 8080, targetPort: jmap}
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-acme
  namespace: stalwart
spec:
  selector:
    app: stalwart
  ports:
    - {name: acme, port: 8081, targetPort: acme}
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-imap
  namespace: stalwart
spec:
  type: ClusterIP
  # Stable, node-local upstream for Tailscale Serve's TLS forwarder.
  clusterIP: 10.43.123.232
  selector:
    app: stalwart
  ports:
    - {name: imap, port: 1143, targetPort: imap}
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-submission
  namespace: stalwart
spec:
  type: ClusterIP
  # Stable, node-local upstream for Tailscale Serve's TLS forwarder.
  clusterIP: 10.43.123.233
  selector:
    app: stalwart
  ports:
    - {name: submission, port: 1587, targetPort: submission}
