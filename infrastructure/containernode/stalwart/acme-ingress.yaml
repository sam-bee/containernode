apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart-acme
  namespace: stalwart
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: mail.nightwatch-research.co.uk
      http:
        paths:
          - path: /.well-known/acme-challenge/
            pathType: Prefix
            backend:
              service:
                name: stalwart-acme
                port:
                  name: acme
