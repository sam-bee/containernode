apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stalwart
  namespace: stalwart
spec:
  podSelector:
    matchLabels:
      app: stalwart
  policyTypes: [Ingress]
  # The IMAP backend is reachable by node-local Tailscale Serve only.
  ingress:
    - ports: [{protocol: TCP, port: 25}]
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: email-mcp
          podSelector:
            matchLabels:
              app: email-mcp
      ports: [{protocol: TCP, port: 8080}]
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports: [{protocol: TCP, port: 8081}]
