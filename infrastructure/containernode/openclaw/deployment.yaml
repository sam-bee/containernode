apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      annotations:
        openclaw.sambee.co/config-revision: "2026-10-25-official-image-v1"
      labels:
        app: openclaw
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-home
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              mkdir -p \
                /home/node/.openclaw/workspace \
                /home/node/.openclaw/workspace-grok-number1/skills/playwright-cli \
                /home/node/.openclaw/workspace-personal \
                /home/node/.openclaw/workspace-3-8 \
                /tmp-root/openclaw-private
              chmod 700 /tmp-root/openclaw-private
              cp /config/openclaw.json /home/node/.openclaw/openclaw.json
              cp /config/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
              cp /prompt-grok-number1/AGENTS.md /home/node/.openclaw/workspace-grok-number1/AGENTS.md
              cp /prompt-grok-number1/SOUL.md /home/node/.openclaw/workspace-grok-number1/SOUL.md
              cp /prompt-grok-number1/IDENTITY.md /home/node/.openclaw/workspace-grok-number1/IDENTITY.md
              cp /prompt-grok-number1/USER.md /home/node/.openclaw/workspace-grok-number1/USER.md
              cp /prompt-grok-number1/TOOLS.md /home/node/.openclaw/workspace-grok-number1/TOOLS.md
              cp /prompt-grok-number1/HEARTBEAT.md /home/node/.openclaw/workspace-grok-number1/HEARTBEAT.md
              cp /prompt-3-8/AGENTS.md /home/node/.openclaw/workspace-3-8/AGENTS.md
              cp /prompt-3-8/SOUL.md /home/node/.openclaw/workspace-3-8/SOUL.md
              cp /prompt-3-8/IDENTITY.md /home/node/.openclaw/workspace-3-8/IDENTITY.md
              cp /prompt-3-8/USER.md /home/node/.openclaw/workspace-3-8/USER.md
              cp /prompt-3-8/TOOLS.md /home/node/.openclaw/workspace-3-8/TOOLS.md
              cp /prompt-3-8/HEARTBEAT.md /home/node/.openclaw/workspace-3-8/HEARTBEAT.md
              cp -R /skill-grok-number1-playwright-cli/. /home/node/.openclaw/workspace-grok-number1/skills/playwright-cli/
              rm -f /home/node/.openclaw/workspace-grok-number1/BOOTSTRAP.md
              rm -f /home/node/.openclaw/workspace-3-8/BOOTSTRAP.md
              # The emptyDir survives container restarts; replace the link without following it.
              ln -sfn /home/node/.openclaw/workspace-grok-number1/research-playwright-media /research-media-path-compat/.playwright-mcp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config
              readOnly: true
            - name: prompt-grok-number1
              mountPath: /prompt-grok-number1
              readOnly: true
            - name: prompt-3-8
              mountPath: /prompt-3-8
              readOnly: true
            - name: skill-grok-number1-playwright-cli
              mountPath: /skill-grok-number1-playwright-cli
              readOnly: true
            - name: research-media-path-compat
              mountPath: /research-media-path-compat
            - name: tmp
              mountPath: /tmp-root
        - name: install-external-plugins
          image: ghcr.io/openclaw/openclaw:2026.10.7@sha256:fb26f0841659dc757f23feec9adeab51f11d76779a409db5d22e191b43841afa
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              state_db=/home/node/.openclaw/state/openclaw.sqlite
              schema_marker=/home/node/.openclaw/.state-schema-2026.10.7
              session_marker=/home/node/.openclaw/.session-sqlite-validate-2026.10.7
              plugin_marker=/home/node/.openclaw/.plugins-2026.10.7
              private_tmp=/home/node/.openclaw/.tmp
              mkdir -p "${private_tmp}"
              chmod 700 "${private_tmp}"

              plugins_match() {
                openclaw plugins list --json > "${private_tmp}/plugins.json" 2>/dev/null
                node -e '
                  const fs = require("node:fs");
                  const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  const expected = new Map([
                    ["matrix", {version: "2026.10.7", origin: "global", status: "loaded"}],
                    ["deepseek", {version: "2026.10.7", origin: "global", status: "loaded"}],
                    ["codex", {version: "2026.10.7", origin: "bundled", status: "loaded"}],
                  ]);
                  for (const [id, want] of expected) {
                    const got = data.plugins.find((plugin) => plugin.id === id);
                    if (!got || got.version !== want.version || got.origin !== want.origin || got.status !== want.status || got.enabled !== true) process.exit(1);
                  }
                ' "${private_tmp}/plugins.json"
              }

              if [ -f "${state_db}" ] && [ ! -f "${schema_marker}" ]; then
                STATE_DB="${state_db}" node --experimental-sqlite -e '
                  const { DatabaseSync } = require("node:sqlite");
                  const db = new DatabaseSync(process.env.STATE_DB);
                  db.exec("BEGIN IMMEDIATE");
                  try {
                    db.exec(`
                    CREATE TABLE IF NOT EXISTS user_profiles (
                      id TEXT NOT NULL PRIMARY KEY,
                      display_name TEXT,
                      primary_github_account_id INTEGER,
                      avatar BLOB,
                      avatar_mime TEXT,
                      avatar_sha256 TEXT,
                      merged_into TEXT,
                      role TEXT,
                      created_at INTEGER NOT NULL,
                      updated_at INTEGER NOT NULL
                    ) STRICT;
                    CREATE TABLE IF NOT EXISTS user_profile_emails (
                      email TEXT NOT NULL PRIMARY KEY,
                      profile_id TEXT NOT NULL,
                      binding_id TEXT,
                      created_at INTEGER NOT NULL
                    ) STRICT;
                    CREATE TABLE IF NOT EXISTS user_profile_identities (
                      provider TEXT NOT NULL,
                      subject TEXT NOT NULL,
                      profile_id TEXT NOT NULL,
                      canonical_login TEXT,
                      created_at INTEGER NOT NULL,
                      authorization_id TEXT,
                      authorization_basis_json TEXT,
                      PRIMARY KEY (provider, subject)
                    ) STRICT;
                    `);
                    const columns = (table) => new Set(db.prepare(`PRAGMA table_info(${table})`).all().map((row) => row.name));
                    const additions = {
                      user_profiles: [["primary_github_account_id", "INTEGER"], ["role", "TEXT"]],
                      user_profile_emails: [["binding_id", "TEXT"]],
                      user_profile_identities: [["canonical_login", "TEXT"], ["authorization_id", "TEXT"], ["authorization_basis_json", "TEXT"]]
                    };
                    for (const [table, defs] of Object.entries(additions)) {
                      const present = columns(table);
                      for (const [name, type] of defs) if (!present.has(name)) db.exec(`ALTER TABLE ${table} ADD COLUMN ${name} ${type}`);
                    }
                    db.exec("CREATE INDEX IF NOT EXISTS idx_user_profile_identities_profile_id ON user_profile_identities(profile_id)");
                    db.exec("CREATE UNIQUE INDEX IF NOT EXISTS idx_user_profile_identities_authorization ON user_profile_identities(authorization_id)");
                    db.exec("CREATE INDEX IF NOT EXISTS idx_user_profile_emails_profile_id ON user_profile_emails(profile_id)");
                    db.exec("COMMIT");
                  } catch (error) {
                    try { db.exec("ROLLBACK"); } catch {}
                    throw error;
                  }
                  db.close();
                '
                touch "${schema_marker}"
              fi

              if [ ! -f "${plugin_marker}" ] || ! plugins_match; then
                if ! openclaw plugins update '@openclaw/matrix@2026.10.7' --accept-capabilities; then
                  openclaw plugins install '@openclaw/matrix@2026.10.7' --pin --force --accept-capabilities
                fi
                if ! openclaw plugins update '@openclaw/deepseek-provider@2026.10.7' --accept-capabilities; then
                  openclaw plugins install '@openclaw/deepseek-provider@2026.10.7' --pin --force --accept-capabilities
                fi
                plugins_match
                touch "${plugin_marker}"
              fi

              if [ ! -f "${session_marker}" ]; then
                openclaw doctor --session-sqlite inspect --session-sqlite-all-agents --non-interactive
                openclaw doctor --session-sqlite validate --session-sqlite-all-agents --non-interactive
                touch "${session_marker}"
              fi
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw
            - name: OPENCLAW_CONFIG_PATH
              value: /home/node/.openclaw/openclaw.json
            - name: OPENCLAW_STATE_DIR
              value: /home/node/.openclaw
            - name: NPM_CONFIG_CACHE
              value: /home/node/.openclaw/npm-cache
            - name: TMPDIR
              value: /home/node/.openclaw/.tmp
            - name: TMP
              value: /home/node/.openclaw/.tmp
            - name: TEMP
              value: /home/node/.openclaw/.tmp
            - name: SQLITE_TMPDIR
              value: /home/node/.openclaw/.tmp
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: OPENCLAW_MATRIX_CODEX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-matrix-secrets
                  key: MATRIX_ACCESS_TOKEN
            - name: MATRIX_GROK_NUMBER1_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-matrix-secrets
                  key: MATRIX_GROK_NUMBER1_ACCESS_TOKEN
            - name: MATRIX_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-matrix-secrets
                  key: MATRIX_PERSONAL_ACCESS_TOKEN
            - name: MATRIX_3_8_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-matrix-secrets
                  key: MATRIX_3_8_ACCESS_TOKEN
            - name: THREE_EIGHT_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: THREE_EIGHT_BASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/node/.openclaw
            - name: cache
              mountPath: /home/node/.cache
            - name: tmp
              mountPath: /tmp
              subPath: openclaw-private
      containers:
        - name: gateway
          image: ghcr.io/openclaw/openclaw:2026.10.7@sha256:fb26f0841659dc757f23feec9adeab51f11d76779a409db5d22e191b43841afa
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/tini
            - -s
            - --
            - node
            - /app/openclaw.mjs
          args:
            - gateway
          env:
            - name: HOME
              value: /home/node
            - name: NODE_ENV
              value: production
            - name: TZ
              value: Europe/London
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw
            - name: OPENCLAW_CONFIG_PATH
              value: /home/node/.openclaw/openclaw.json
            - name: OPENCLAW_STATE_DIR
              value: /home/node/.openclaw
            - name: OPENCLAW_WORKSPACE_DIR
              value: /home/node/.openclaw/workspace
            - name: OPENCLAW_DISABLE_BONJOUR
              value: "1"
            - name: TMPDIR
              value: /home/node/.openclaw/.tmp
            - name: TMP
              value: /home/node/.openclaw/.tmp
            - name: TEMP
              value: /home/node/.openclaw/.tmp
            - name: SQLITE_TMPDIR
              value: /home/node/.openclaw/.tmp
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: OPENCLAW_MATRIX_CODEX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-matrix-secrets
                  key: MATRIX_ACCESS_TOKEN
            - name: MATRIX_GROK_NUMBER1_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-matrix-secrets
                  key: MATRIX_GROK_NUMBER1_ACCESS_TOKEN
            - name: MATRIX_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-matrix-secrets
                  key: MATRIX_PERSONAL_ACCESS_TOKEN
            - name: MATRIX_3_8_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-matrix-secrets
                  key: MATRIX_3_8_ACCESS_TOKEN
            - name: THREE_EIGHT_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: THREE_EIGHT_BASE_URL
          ports:
            - name: gateway
              containerPort: 18789
              hostIP: 127.0.0.1
              hostPort: 18789
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: gateway
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
            periodSeconds: 30
            timeoutSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/node/.openclaw
            - name: cache
              mountPath: /home/node/.cache
            - name: research-playwright-media
              mountPath: /home/node/.openclaw/workspace-grok-number1/research-playwright-media
              readOnly: true
            - name: research-media-path-compat
              mountPath: /mnt/workfiles/synced/tech-projects/security-research/01-packagist
              readOnly: true
            - name: tmp
              mountPath: /tmp
              subPath: openclaw-private
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: openclaw-home
        - name: config
          configMap:
            name: openclaw-config
        - name: prompt-grok-number1
          configMap:
            name: openclaw-grok-number1-prompt
        - name: prompt-3-8
          configMap:
            name: openclaw-3-8-prompt
        - name: skill-grok-number1-playwright-cli
          configMap:
            name: openclaw-grok-number1-playwright-cli-skill
            items:
              - key: SKILL.md
                path: SKILL.md
              - key: element-attributes.md
                path: references/element-attributes.md
              - key: playwright-tests.md
                path: references/playwright-tests.md
              - key: request-mocking.md
                path: references/request-mocking.md
              - key: running-code.md
                path: references/running-code.md
              - key: session-management.md
                path: references/session-management.md
              - key: storage-state.md
                path: references/storage-state.md
              - key: test-generation.md
                path: references/test-generation.md
              - key: tracing.md
                path: references/tracing.md
              - key: video-recording.md
                path: references/video-recording.md
        - name: research-playwright-media
          hostPath:
            path: /mnt/workfiles/synced/tech-projects/security-research/01-packagist/.playwright-mcp
            type: Directory
        - name: research-media-path-compat
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
