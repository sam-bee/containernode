apiVersion: v1
kind: PersistentVolume
metadata:
  name: openclaw-home
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/userdata-clusterfiles/k3s-volumes/openclaw
    type: DirectoryOrCreate
  claimRef:
    namespace: openclaw
    name: openclaw-home
