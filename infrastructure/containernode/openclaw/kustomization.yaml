apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - persistentvolume.yaml
  - persistentvolumeclaim.yaml
  - openclaw-secrets.secret.sops.yaml
  - openclaw-matrix-secrets.secret.sops.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: openclaw-config
    namespace: openclaw
    files:
      - openclaw.json
      - AGENTS.md=prompts/codex/AGENTS.md
  - name: openclaw-grok-number1-prompt
    namespace: openclaw
    files:
      - AGENTS.md=prompts/grok-number1/AGENTS.md
      - SOUL.md=prompts/grok-number1/SOUL.md
      - IDENTITY.md=prompts/grok-number1/IDENTITY.md
      - USER.md=prompts/grok-number1/USER.md
      - TOOLS.md=prompts/grok-number1/TOOLS.md
      - HEARTBEAT.md=prompts/grok-number1/HEARTBEAT.md
