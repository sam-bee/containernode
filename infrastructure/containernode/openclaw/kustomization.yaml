apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - persistentvolume.yaml
  - persistentvolumeclaim.yaml
  - openclaw-secrets.secret.sops.yaml
  - openclaw-matrix-secrets.secret.sops.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: openclaw-config
    namespace: openclaw
    files:
      - openclaw.json
      - AGENTS.md=agent-content/codex/AGENTS.md
  - name: openclaw-grok-number1-prompt
    namespace: openclaw
    files:
      - AGENTS.md=agent-content/grok-number1/AGENTS.md
      - SOUL.md=agent-content/grok-number1/SOUL.md
      - IDENTITY.md=agent-content/grok-number1/IDENTITY.md
      - USER.md=agent-content/grok-number1/USER.md
      - TOOLS.md=agent-content/grok-number1/TOOLS.md
      - HEARTBEAT.md=agent-content/grok-number1/HEARTBEAT.md
  - name: openclaw-3-8-prompt
    namespace: openclaw
    files:
      - AGENTS.md=agent-content/3-8/AGENTS.md
      - SOUL.md=agent-content/3-8/SOUL.md
      - IDENTITY.md=agent-content/3-8/IDENTITY.md
      - USER.md=agent-content/3-8/USER.md
      - TOOLS.md=agent-content/3-8/TOOLS.md
      - HEARTBEAT.md=agent-content/3-8/HEARTBEAT.md
  - name: openclaw-grok-number1-playwright-cli-skill
    namespace: openclaw
    files:
      - SKILL.md=agent-content/grok-number1/skills/playwright-cli/SKILL.md
      - element-attributes.md=agent-content/grok-number1/skills/playwright-cli/references/element-attributes.md
      - playwright-tests.md=agent-content/grok-number1/skills/playwright-cli/references/playwright-tests.md
      - request-mocking.md=agent-content/grok-number1/skills/playwright-cli/references/request-mocking.md
      - running-code.md=agent-content/grok-number1/skills/playwright-cli/references/running-code.md
      - session-management.md=agent-content/grok-number1/skills/playwright-cli/references/session-management.md
      - storage-state.md=agent-content/grok-number1/skills/playwright-cli/references/storage-state.md
      - test-generation.md=agent-content/grok-number1/skills/playwright-cli/references/test-generation.md
      - tracing.md=agent-content/grok-number1/skills/playwright-cli/references/tracing.md
      - video-recording.md=agent-content/grok-number1/skills/playwright-cli/references/video-recording.md
