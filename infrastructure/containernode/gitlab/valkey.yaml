apiVersion: v1
kind: Service
metadata:
  name: gitlab-valkey
  namespace: gitlab
spec:
  selector:
    app.kubernetes.io/name: gitlab-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-valkey
  namespace: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: set-permissions
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - chown -R 999:999 /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
              drop:
                - ALL
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: valkey
          image: valkey/valkey:7.2.14
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - >-
              exec valkey-server
              --appendonly yes
              --appendfsync everysec
              --maxmemory-policy noeviction
              --requirepass "$VALKEY_PASSWORD"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-valkey
                  key: password
            - name: VALKEYCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: gitlab-valkey
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - valkey-cli ping | grep -q PONG
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - valkey-cli ping | grep -q PONG
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - valkey-cli ping | grep -q PONG
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-valkey-data
