apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: garagenodes.deuxfleurs.fr
spec:
  conversion:
    strategy: None
  group: deuxfleurs.fr
  names:
    kind: GarageNode
    listKind: GarageNodeList
    plural: garagenodes
    singular: garagenode
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - address
                - hostname
                - port
              properties:
                address:
                  type: string
                  format: ip
                hostname:
                  type: string
                port:
                  type: integer
                  format: uint16
                  minimum: 0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-garage
  namespace: gitlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-garage-discovery
  namespace: gitlab
rules:
  - apiGroups:
      - deuxfleurs.fr
    resources:
      - garagenodes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-garage-discovery
  namespace: gitlab
subjects:
  - kind: ServiceAccount
    name: gitlab-garage
    namespace: gitlab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-garage-discovery
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-garage-config
  namespace: gitlab
data:
  garage.toml: |-
    metadata_dir = "/mnt/meta"
    data_dir = "/mnt/data"
    db_engine = "lmdb"
    block_size = 1048576
    replication_factor = 3
    consistency_mode = "consistent"
    compression_level = 1
    metadata_auto_snapshot_interval = "6h"
    rpc_bind_addr = "[::]:3901"
    rpc_secret = "__RPC_SECRET_REPLACE__"
    bootstrap_peers = []

    [kubernetes_discovery]
    namespace = "gitlab"
    service_name = "gitlab-garage"
    skip_crd = true

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.gitlab-garage.gitlab.svc.cluster.local"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.gitlab-garage.gitlab.svc.cluster.local"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-garage-headless
  namespace: gitlab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: gitlab-garage
  ports:
    - name: s3-api
      port: 3900
      targetPort: s3-api
    - name: rpc
      port: 3901
      targetPort: rpc
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-garage
  namespace: gitlab
spec:
  selector:
    app.kubernetes.io/name: gitlab-garage
  ports:
    - name: s3-api
      port: 3900
      targetPort: s3-api
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab-garage
  namespace: gitlab
spec:
  replicas: 3
  serviceName: gitlab-garage-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-garage
    spec:
      serviceAccountName: gitlab-garage
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: set-permissions
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - chown -R 1000:1000 /mnt/meta /mnt/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
              drop:
                - ALL
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: meta
              mountPath: /mnt/meta
            - name: data
              mountPath: /mnt/data
        - name: configure
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - sed "s/__RPC_SECRET_REPLACE__/$RPC_SECRET/" /config-source/garage.toml > /config/garage.toml
          env:
            - name: RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitlab-garage-rpc
                  key: rpcSecret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: config-source
              mountPath: /config-source
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: garage
          image: dxflrs/amd64_garage:v2.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: s3-api
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: web-api
              containerPort: 3902
            - name: admin
              containerPort: 3903
          startupProbe:
            tcpSocket:
              port: s3-api
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: s3-api
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3-api
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: meta
              mountPath: /mnt/meta
            - name: data
              mountPath: /mnt/data
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
      volumes:
        - name: config-source
          configMap:
            name: gitlab-garage-config
        - name: config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ""
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ""
        resources:
          requests:
            storage: 20Gi
